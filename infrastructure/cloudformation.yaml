AWSTemplateFormatVersion: "2010-09-09"
Description: QueueCraft development infrastructure with safe AWS defaults.

Parameters:
  ProjectName:
    Type: String
    Default: queuecraft
    AllowedPattern: "[a-z][a-z0-9-]{1,30}"
    Description: Lowercase name used to prefix AWS resources.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production

  VisibilityTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 43200
    Description: Initial time a received job remains hidden from other workers.

  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Failed receives allowed before SQS moves a job to the DLQ.

  EnablePointInTimeRecovery:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enables paid continuous backups for the DynamoDB lease table.

  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address that receives dead-letter queue alarms. The recipient must confirm the SNS subscription.

Conditions:
  PointInTimeRecoveryEnabled: !Equals
    - !Ref EnablePointInTimeRecovery
    - "true"
  HasAlarmEmail: !Not
    - !Equals
      - !Ref AlarmEmail
      - ""

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-jobs-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-jobs"
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: !Ref VisibilityTimeoutSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-alarms"
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-dead-letter-messages"
      AlarmDescription: A QueueCraft job failed repeatedly and reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmEmail
        - - !Ref AlarmTopic
        - !Ref AWS::NoValue

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-leases"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If
          - PointInTimeRecoveryEnabled
          - true
          - false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ProducerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-producer"
      Description: Minimum permissions required to publish QueueCraft jobs.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishJobs
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SendMessage
            Resource: !GetAtt JobQueue.Arn

  ConsumerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-consumer"
      Description: Minimum permissions required by a QueueCraft worker.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ConsumeJobs
            Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ReceiveMessage
            Resource: !GetAtt JobQueue.Arn
          - Sid: ManageExecutionLeases
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt IdempotencyTable.Arn

Outputs:
  AwsRegion:
    Description: Region selected when this stack was created.
    Value: !Ref AWS::Region

  QueueUrl:
    Description: Set this as SQS_QUEUE_URL in the publisher and worker.
    Value: !Ref JobQueue

  QueueArn:
    Value: !GetAtt JobQueue.Arn

  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue

  DeadLetterQueueArn:
    Value: !GetAtt DeadLetterQueue.Arn

  DeadLetterAlarmName:
    Value: !Ref DeadLetterQueueAlarm

  AlarmTopicArn:
    Condition: HasAlarmEmail
    Value: !Ref AlarmTopic

  IdempotencyTableName:
    Description: Pass this table name to IdempotencyStore in the worker.
    Value: !Ref IdempotencyTable

  ProducerPolicyArn:
    Description: Attach this policy only to the YallaQueue publisher identity.
    Value: !Ref ProducerPolicy

  ConsumerPolicyArn:
    Description: Attach this policy only to the worker identity.
    Value: !Ref ConsumerPolicy
