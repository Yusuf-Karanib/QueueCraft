AWSTemplateFormatVersion: "2010-09-09"
Description: QueueCraft development infrastructure with safe AWS defaults.

Parameters:
  ProjectName:
    Type: String
    Default: queuecraft
    AllowedPattern: "[a-z][a-z0-9-]{1,30}"
    Description: Lowercase name used to prefix AWS resources.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production

  VisibilityTimeoutSeconds:
    Type: Number
    Default: 180
    MinValue: 1
    MaxValue: 43200
    Description: Initial time a received job remains hidden from other workers.

  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: Failed receives allowed before SQS moves a job to the DLQ.

  EnablePointInTimeRecovery:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enables paid continuous backups for the DynamoDB lease table.

  EnableOperationsDashboard:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Creates an optional private CloudWatch operations dashboard. CloudWatch charges may apply.

  JobQueueAgeAlarmThresholdSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 345600
    Description: Oldest unprocessed-message age that triggers the queue age alarm.

  JobQueueAgeAlarmEvaluationPeriods:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 60
    Description: Consecutive one-minute periods required before the queue age alarm fires.

  EnableJobQueueDepthAlarm:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enables an optional alarm for a sustained visible-message backlog.

  JobQueueDepthAlarmThresholdMessages:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Visible-message count that triggers the optional backlog alarm.

  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address that receives QueueCraft alarms. The recipient must confirm the SNS subscription.

Conditions:
  PointInTimeRecoveryEnabled: !Equals
    - !Ref EnablePointInTimeRecovery
    - "true"
  HasAlarmEmail: !Not
    - !Equals
      - !Ref AlarmEmail
      - ""
  OperationsDashboardEnabled: !Equals
    - !Ref EnableOperationsDashboard
    - "true"
  JobQueueDepthAlarmEnabled: !Equals
    - !Ref EnableJobQueueDepthAlarm
    - "true"

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-jobs-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-jobs"
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: !Ref VisibilityTimeoutSeconds
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-alarms"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-dead-letter-messages"
      AlarmDescription: A QueueCraft job failed repeatedly and reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmEmail
        - - !Ref AlarmTopic
        - !Ref AWS::NoValue

  JobQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-oldest-job"
      AlarmDescription: !Sub "The oldest unprocessed QueueCraft message has exceeded ${JobQueueAgeAlarmThresholdSeconds} seconds of approximate queue age."
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: !Ref JobQueueAgeAlarmEvaluationPeriods
      DatapointsToAlarm: !Ref JobQueueAgeAlarmEvaluationPeriods
      Threshold: !Ref JobQueueAgeAlarmThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmEmail
        - - !Ref AlarmTopic
        - !Ref AWS::NoValue

  JobQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: JobQueueDepthAlarmEnabled
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-visible-job-backlog"
      AlarmDescription: !Sub "At least ${JobQueueDepthAlarmThresholdMessages} QueueCraft jobs remained visible for three minutes."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref JobQueueDepthAlarmThresholdMessages
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmEmail
        - - !Ref AlarmTopic
        - !Ref AWS::NoValue

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: OperationsDashboardEnabled
    Properties:
      DashboardName: !Sub "${ProjectName}-${Environment}-${AWS::Region}-operations"
      DashboardBody: !Sub |
        {
          "start": "-PT6H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Queue depth",
                "period": 60,
                "stat": "Maximum",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${JobQueue.QueueName}", {"label": "Ready"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesNotVisible", "QueueName", "${JobQueue.QueueName}", {"label": "In flight"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesDelayed", "QueueName", "${JobQueue.QueueName}", {"label": "Delayed"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DeadLetterQueue.QueueName}", {"label": "Dead letter"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Oldest unprocessed message age",
                "period": 60,
                "stat": "Maximum",
                "metrics": [
                  ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${JobQueue.QueueName}", {"label": "Age in seconds"}]
                ],
                "annotations": {
                  "horizontal": [
                    {"label": "Alarm threshold", "value": ${JobQueueAgeAlarmThresholdSeconds}}
                  ]
                },
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Worker outcomes",
                "period": 300,
                "metrics": [
                  [{"expression": "SEARCH('{\"${ProjectName}/${Environment}\"} MetricName=\"JobsCompleted\"', 'Sum', 300)", "label": "Completed", "id": "e1"}],
                  [{"expression": "SEARCH('{\"${ProjectName}/${Environment}\"} MetricName=\"JobsFailed\"', 'Sum', 300)", "label": "Failed", "id": "e2"}],
                  [{"expression": "SEARCH('{\"${ProjectName}/${Environment}\"} MetricName=\"JobsCancelled\"', 'Sum', 300)", "label": "Cancelled", "id": "e3"}],
                  [{"expression": "SEARCH('{\"${ProjectName}/${Environment}\"} MetricName=\"JobsDuplicate\"', 'Sum', 300)", "label": "Duplicates", "id": "e4"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Average QueueCraft processing duration",
                "period": 300,
                "metrics": [
                  [{"expression": "SEARCH('{\"${ProjectName}/${Environment}\",Outcome} MetricName=\"JobDuration\" Outcome=\"completed\"', 'Average', 300)", "label": "Completed", "id": "e1"}],
                  [{"expression": "SEARCH('{\"${ProjectName}/${Environment}\",Outcome} MetricName=\"JobDuration\" Outcome=\"failed\"', 'Average', 300)", "label": "Failed", "id": "e2"}],
                  [{"expression": "SEARCH('{\"${ProjectName}/${Environment}\",Outcome} MetricName=\"JobDuration\" Outcome=\"cancelled\"', 'Average', 300)", "label": "Cancelled", "id": "e3"}]
                ],
                "yAxis": {"left": {"min": 0, "label": "Milliseconds"}}
              }
            }
          ]
        }

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-leases"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If
          - PointInTimeRecoveryEnabled
          - true
          - false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ProducerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-producer"
      Description: Minimum permissions required to publish QueueCraft jobs.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishJobs
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SendMessage
            Resource: !GetAtt JobQueue.Arn

  ConsumerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-consumer"
      Description: Minimum permissions required by a QueueCraft worker.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ConsumeJobs
            Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ReceiveMessage
            Resource: !GetAtt JobQueue.Arn
          - Sid: ManageExecutionLeases
            Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt IdempotencyTable.Arn
          - Sid: PublishQueueCraftMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: !Sub "${ProjectName}/${Environment}"

  DashboardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-dashboard"
      Description: Minimum permissions required by the local QueueCraft dashboard.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadQueueHealth
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt JobQueue.Arn
              - !GetAtt DeadLetterQueue.Arn
          - Sid: InspectAndRemoveDeadLetters
            Effect: Allow
            Action:
              - sqs:DeleteMessage
              - sqs:ReceiveMessage
            Resource: !GetAtt DeadLetterQueue.Arn
          - Sid: ReplayJobs
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt JobQueue.Arn

Outputs:
  AwsRegion:
    Description: Region selected when this stack was created.
    Value: !Ref AWS::Region

  QueueUrl:
    Description: Set this as SQS_QUEUE_URL in the publisher and worker.
    Value: !Ref JobQueue

  QueueArn:
    Value: !GetAtt JobQueue.Arn

  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue

  DeadLetterQueueArn:
    Value: !GetAtt DeadLetterQueue.Arn

  DeadLetterAlarmName:
    Value: !Ref DeadLetterQueueAlarm

  JobQueueAgeAlarmName:
    Value: !Ref JobQueueAgeAlarm

  JobQueueAgeAlarmThresholdSeconds:
    Value: !Ref JobQueueAgeAlarmThresholdSeconds

  JobQueueAgeAlarmEvaluationPeriods:
    Value: !Ref JobQueueAgeAlarmEvaluationPeriods

  JobQueueDepthAlarmName:
    Condition: JobQueueDepthAlarmEnabled
    Value: !Ref JobQueueDepthAlarm

  JobQueueDepthAlarmThresholdMessages:
    Condition: JobQueueDepthAlarmEnabled
    Value: !Ref JobQueueDepthAlarmThresholdMessages

  OperationsDashboardName:
    Condition: OperationsDashboardEnabled
    Value: !Ref OperationsDashboard

  AlarmTopicArn:
    Condition: HasAlarmEmail
    Value: !Ref AlarmTopic

  IdempotencyTableName:
    Description: Pass this table name to IdempotencyStore in the worker.
    Value: !Ref IdempotencyTable

  MetricsNamespace:
    Description: CloudWatch namespace allowed by the worker policy.
    Value: !Sub "${ProjectName}/${Environment}"

  ProducerPolicyArn:
    Description: Attach this policy only to the application publisher identity.
    Value: !Ref ProducerPolicy

  ConsumerPolicyArn:
    Description: Attach this policy only to the worker identity.
    Value: !Ref ConsumerPolicy

  DashboardPolicyArn:
    Description: Attach this policy only to the local dashboard identity.
    Value: !Ref DashboardPolicy
